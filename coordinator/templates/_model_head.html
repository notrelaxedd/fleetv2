<h2 class="mtitle" data-model-name>{{ selected.name }}</h2>
<p class="tags" data-model-tags>
  {% for tag in selected.tags %}<span class="tag{% if tag in selected.warn_tags %} warn{% endif %}" data-tag>{{ tag }}</span>{% endfor %}
</p>
{% for f in selected.robustness %}<p class="muted small" data-robustness="{{ f.key }}"><strong>{{ f.tag }}.</strong> {{ f.text }}</p>{% endfor %}
{% if selected.robustness_note %}<p class="muted small" data-robustness="unranked">{{ selected.robustness_note }}</p>{% endif %}
<p class="mhow" data-how-it-works>{{ selected.how_it_works }}</p>
<p class="muted small" data-origin>{{ selected.origin }}</p>
