# fleet-v2 futures settings: Topstep's rules for the research simulator, plus the
# futures price download cap. Edit on box1, then `docker compose restart coordinator`.
#
# NOTHING HERE IS A GUESS, AND NOTHING HERE IS CHECKED YET.
# Every Topstep value below comes from the table in docs/DAYTRADING_PLAN.md, which was
# written from third-party summaries of Topstep's rules in October 2026. Topstep changed
# these rules several times in 2025 and 2026. Check every value at help.topstep.com and
# write the date you checked it in its "Last checked" line.
#
# Values the plan does not give are left unset (commented out). Wherever one is needed,
# the dashboard says "Set the fee in config/topstep.toml" (or names the value) instead
# of showing a number.

[data]
# Databento is pay-as-you-go. Before every futures download the coordinator asks
# Databento what bringing MES and MNQ up to date will cost, and refuses when that is
# above this many US dollars. Your own spending cap, not a Topstep rule.
max_download_usd = 10.0

[account]
# The 50K Combine (the plan recommends the 50K account: the cheapest test).
# Source: plan table, third-party summaries, October 2026. Check at help.topstep.com.
# Last checked: not yet.
size = 50000

# Profit target: the Combine passes once the balance is this much above the start.
# Source: plan table ($3,000), third-party summaries, October 2026. Check at help.topstep.com.
# Last checked: not yet.
profit_target = 3000

# Maximum Loss Limit: the account fails when its balance, open trades included, falls to
# the loss floor at any moment of the day. The floor starts this far below the starting
# balance, rises with every new end-of-day high, never falls, and stops rising at the
# starting balance.
# Source: plan table ($2,000, trails the end-of-day high, enforced live, stops at the
# starting balance), third-party summaries, October 2026. Check at help.topstep.com.
# Last checked: not yet.
max_loss_limit = 2000

# Daily loss limit: none (0). The plan's table says it is an optional add-on. With a
# number here, a day that falls that far is closed at that loss and trading stops for
# the day (the account carries on).
# Source: plan table, third-party summaries, October 2026. Check at help.topstep.com.
# Last checked: not yet.
daily_loss_limit = 0

# Most contracts at once: 5 minis or 50 micros. The simulator never tests more micros.
# Source: plan table, third-party summaries, October 2026. Check at help.topstep.com.
# Last checked: not yet.
max_micro_contracts = 50

# Every position must be closed by this time, Chicago time. The backtester closes
# everything at 15:00, before it.
# Source: plan table (3:10 PM CT), third-party summaries, October 2026. Check at help.topstep.com.
# Last checked: not yet.
flat_by = "15:10"

[consistency]
# The best-day rule of the Combine: the Combine only passes while the best single day is
# at most best_day_share of
#   kind = "target"        the profit target (50% of $3,000 = $1,500), or
#   kind = "total_profit"  the total profit so far (keep trading until it is).
# Sources disagree: one says 50% of the target, another 55% of total profit. Both
# kinds work; set the one Topstep uses now.
# Source: plan table, third-party summaries, October 2026. Check at help.topstep.com.
# Last checked: not yet.
kind = "target"
best_day_share = 0.50

[express]
# Express Funded account (after a passed Combine). A payout can be asked for after this
# many winning days of at least payout_min_day_profit dollars of net profit each, counted
# since the start or the last payout.
# Source: plan table (5 days of $150+ net profit), third-party summaries, October 2026.
# Check at help.topstep.com. Last checked: not yet.
payout_winning_days = 5
payout_min_day_profit = 150

# A payout is at most this share of the profit in the account...
# Source: plan table (up to 50% of balance), third-party summaries, October 2026.
# Check at help.topstep.com. Last checked: not yet.
payout_share_of_balance = 0.50

# ...and at most this many dollars. The plan says payouts are "capped by account size
# and path" without a number, so it is unset: the simulator says "Set the payout cap
# in config/topstep.toml" until you fill it in.
# Source: none yet. Check at help.topstep.com.
# max_payout =

# Your share of each payout.
# Source: plan table (90/10), third-party summaries, October 2026. Check at help.topstep.com.
# Last checked: not yet.
profit_split = 0.90

# After a payout the loss floor moves up to the starting balance (true), so the account
# fails if it ever falls back to where it started.
# Source: plan table, third-party summaries, October 2026. Check at help.topstep.com.
# Last checked: not yet.
floor_to_start_after_payout = true

[fees]
# All unset on purpose. Until you fill them in, the dashboard says "Set the fee in
# config/topstep.toml" wherever one is needed, and futures backtests and model search
# do not start.
#
# Commission plus exchange fees, dollars per contract per side (one buy or one sell),
# for each micro. The plan quotes Topstep listing micro commission at $0.25 per side and
# its own MNQ example at about $1.22 for a whole round trip including exchange fees.
# Check at help.topstep.com.
# commission_per_side_MES =
# commission_per_side_MNQ =
#
# The Combine's monthly fee, and the one-time fee to activate an Express Funded account
# after passing. Check at help.topstep.com.
# combine_monthly =
# activation =

[costs]
# Slippage per side, in ticks: every buy fills this many ticks above the price, every
# sell below. Model search scores at twice this. Our own assumption, not Topstep's.
slippage_ticks = 1

[simulator]
# How the simulator replays a model. Our own choices, not Topstep's rules.
# The Express Funded account is played for at most this many trading days.
express_days = 120
# A Combine that has neither passed nor failed after this many trading days is given up
# (about three months of fees). Attempts only start where this many days are left.
combine_max_days = 60
# Trading days in a month, for counting monthly Combine fees.
days_per_month = 21
# Coin-flip twins averaged per model (same trade times, random direction).
twin_seeds = 10
# Contract sizes tried: 1 up to this many micros, but never past the size at which the
# model's worst training stretch would use more than sizing_share of the loss limit.
max_sizes = 10
sizing_share = 0.5

[ready]
# What "ready for a Combine" needs, besides real (Databento) prices. Our own
# thresholds, not Topstep's.
# Held-out: the pass rate must beat the coin-flip twin's by at least this much (0.10 = 10 points).
min_pass_rate_edge = 0.10
# Lockbox: the pass rate may fall at most this much below the held-out one.
max_lockbox_drop = 0.15
# Shadow trading on live prices (stage 6, not built yet): at least this many days.
min_shadow_days = 20
