[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-v2"
version = "0.1.0"
description = "Alpaca stock and crypto research and paper trading on a fleet of old computers"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The coordinator (box1, in Docker). Only this side talks to Alpaca.
coordinator = [
  "alpaca-py>=0.44,<1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary,pool]>=3.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
  "numpy>=1.26",
  "anthropic>=1.12,<2",
]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["coordinator*", "fleet2*"]

[tool.setuptools.package-data]
coordinator = ["migrations/*.sql", "templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
